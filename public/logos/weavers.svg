<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Weavers</title>
  <defs>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d5c"/>
      <stop offset="50%" stop-color="#dc143c"/>
      <stop offset="100%" stop-color="#9a1028"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eceae4"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="#060607"/>
  <rect width="100" height="100" rx="18" fill="none" stroke="#25252d" stroke-width="1"/>
  <!-- Thread weave (subtle) -->
  <g opacity=".22" stroke="#dc143c" fill="none" stroke-linecap="round">
    <path d="M6 40 C34 30 66 52 94 42" stroke-width="1.6"/>
    <path d="M6 60 C36 70 64 48 94 58" stroke-width="1.6"/>
    <path d="M50 8 C44 36 56 64 50 92" stroke-width="1.2"/>
  </g>
  <!-- Panel corners -->
  <g stroke="#dc143c" stroke-width="2.2" stroke-linecap="square" fill="none" opacity=".9">
    <path d="M14 14h11v11"/>
    <path d="M86 14v11h11"/>
    <path d="M14 86v-11h11"/>
    <path d="M86 86h-11v-11"/>
  </g>
  <!-- W: shadow -->
  <path
    d="M24 29 L38 72 L50 47 L62 72 L76 29"
    fill="none"
    stroke="#3d060f"
    stroke-width="10"
    stroke-linejoin="round"
    stroke-linecap="round"
    transform="translate(2 2.5)"/>
  <!-- W: body -->
  <path
    d="M24 29 L38 72 L50 47 L62 72 L76 29"
    fill="none"
    stroke="url(#crimson)"
    stroke-width="9"
    stroke-linejoin="round"
    stroke-linecap="round"/>
  <!-- W: top highlight -->
  <path
    d="M24 29 L38 72 L50 47 L62 72 L76 29"
    fill="none"
    stroke="url(#shine)"
    stroke-width="3.2"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity=".88"/>
</svg>
